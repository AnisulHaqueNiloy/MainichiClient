<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Primary SEO Meta Tags -->
    <title>Mainichi Halal Food Shop | 100% Certified Halal Groceries in Japan</title>
    <meta
      name="title"
      content="Mainichi Halal Food Shop | 100% Certified Halal Groceries in Japan"
    />
    <meta
      name="description"
      content="Order 100% certified Halal food, fresh halal meat, spices, basmati rice, and everyday groceries in Japan. Fast nationwide home delivery and Cash on Delivery (COD) available."
    />
    <meta
      name="keywords"
      content="halal food japan, halal meat tokyo, halal grocery online japan, mainichi halal shop, halal spices japan, halal chicken tokyo, halal beef japan, halal food online order japan"
    />
    <meta name="author" content="Mainichi Halal Food Shop" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://mainichihalalshop.com/" />

    <!-- Geo Tags for Local SEO in Japan -->
    <meta name="geo.region" content="JP" />
    <meta name="geo.placename" content="Tokyo, Japan" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mainichihalalshop.com/" />
    <meta property="og:site_name" content="Mainichi Halal Food Shop" />
    <meta
      property="og:title"
      content="Mainichi Halal Food Shop | 100% Certified Halal Groceries in Japan"
    />
    <meta
      property="og:description"
      content="Order 100% certified Halal food, fresh halal meat, spices, basmati rice, and everyday groceries in Japan with fast nationwide delivery."
    />
    <meta property="og:image" content="https://mainichihalalshop.com/logo.png" />
    <meta property="og:image:alt" content="Mainichi Halal Food Shop Logo" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://mainichihalalshop.com/" />
    <meta
      name="twitter:title"
      content="Mainichi Halal Food Shop | 100% Certified Halal Groceries in Japan"
    />
    <meta
      name="twitter:description"
      content="Order 100% certified Halal food, fresh halal meat, spices, basmati rice, and everyday groceries in Japan with fast nationwide delivery."
    />
    <meta name="twitter:image" content="https://mainichihalalshop.com/logo.png" />

    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://mainichihalalshop.com/#website",
            "url": "https://mainichihalalshop.com/",
            "name": "Mainichi Halal Food Shop",
            "description": "100% Certified Halal Groceries, Meat & Spices in Japan",
            "potentialAction": [
              {
                "@type": "SearchAction",
                "target": {
                  "@type": "EntryPoint",
                  "urlTemplate": "https://mainichihalalshop.com/all_products?keyword={search_term_string}"
                },
                "query-input": "required name=search_term_string"
              }
            ]
          },
          {
            "@type": "GroceryStore",
            "@id": "https://mainichihalalshop.com/#organization",
            "name": "Mainichi Halal Food Shop",
            "url": "https://mainichihalalshop.com/",
            "logo": "https://mainichihalalshop.com/logo.png",
            "image": "https://mainichihalalshop.com/logo.png",
            "description": "Premium halal grocery provider in Japan offering certified halal meats, spices, rice, and pantry goods with Cash on Delivery nationwide.",
            "priceRange": "¥¥",
            "address": {
              "@type": "PostalAddress",
              "addressCountry": "JP",
              "addressRegion": "Tokyo"
            },
            "paymentAccepted": "Cash on Delivery",
            "currenciesAccepted": "JPY"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
